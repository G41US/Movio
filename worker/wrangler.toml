name = "movio-helper"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Synced My List, Continue watching and resume points, by link code.
[[kv_namespaces]]
binding = "MOVIO_SYNC"
id = "22fa04177cfa466e89b2a0640ecc2bd9"

# Usage book for the admin page (SQLite Durable Object, free plan).
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[durable_objects.bindings]]
name = "TOGETHER"
class_name = "Together"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stats"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Together", "Room"]
