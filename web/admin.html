<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07080c">
<title>Movio · Admin</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #07080c; --panel: #111218; --panel2: #171821; --line: rgba(255,255,255,.07); --soft: #c9cad3; --muted: #8a8c99; --a: #ff4d2e; --b: #ff9f1c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: #fff; font-family: "Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: max(22px, env(safe-area-inset-top)) 20px 40px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  header img { width: 44px; height: 44px; border-radius: 12px; }
  header h1 { font-size: 22px; margin: 0; font-weight: 800; letter-spacing: -.3px; }
  header small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 600; margin-top: 2px; }
  header .sp { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--soft); background: var(--panel); border: 1px solid var(--line); padding: 7px 12px; border-radius: 999px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #34d27b; box-shadow: 0 0 10px #34d27b; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 16px 16px 14px; }
  .kpi b { display: block; font-size: 30px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
  .kpi span { color: var(--muted); font-size: 12.5px; font-weight: 700; }
  .kpi.hot { background: linear-gradient(135deg, rgba(255,77,46,.22), rgba(255,159,28,.12)); border-color: rgba(255,120,60,.35); }
  .kpi.hot b { background: linear-gradient(90deg, #fff, #ffd2b8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; margin-top: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 18px; min-width: 0; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 0 0 14px; font-weight: 800; }
  .chart { display: flex; align-items: flex-end; gap: 5px; height: 170px; padding-top: 10px; }
  .chart .c { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; min-width: 0; }
  .chart .bar { width: 100%; border-radius: 7px 7px 3px 3px; background: linear-gradient(180deg, var(--b), var(--a)); min-height: 3px; position: relative; }
  .chart .bar:hover::after { content: attr(data-n); position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 800; }
  .chart .d { font-size: 10px; color: var(--muted); font-weight: 700; white-space: nowrap; }
  .row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--panel2); font-size: 17px; flex: none; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t small { color: var(--muted); font-size: 12px; font-weight: 600; }
  .row .n { font-weight: 800; font-size: 15px; }
  .meter { height: 6px; border-radius: 3px; background: rgba(255,255,255,.07); margin-top: 6px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--a), var(--b)); }
  .poster { width: 34px; height: 51px; border-radius: 7px; object-fit: cover; background: var(--panel2); flex: none; }
  .empty { color: var(--muted); font-size: 13.5px; font-weight: 600; padding: 8px 0; }
  .login { max-width: 380px; margin: 14vh auto 0; text-align: center; }
  .login img { width: 72px; height: 72px; border-radius: 18px; }
  .login h1 { font-size: 24px; margin: 16px 0 4px; }
  .login p { color: var(--muted); margin: 0 0 22px; font-weight: 600; font-size: 14px; }
  .login input { width: 100%; height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: #fff; padding: 0 16px; font: 600 16px "Plus Jakarta Sans"; outline: none; }
  .login input:focus { border-color: rgba(255,120,60,.6); box-shadow: 0 0 0 4px rgba(255,77,46,.15); }
  .login button { width: 100%; height: 52px; margin-top: 12px; border: 0; border-radius: 16px; font: 800 16px "Plus Jakarta Sans"; color: #fff; background: linear-gradient(90deg, var(--a), var(--b)); cursor: pointer; }
  .login .err { color: #ff7a6b; font-size: 13px; font-weight: 700; margin-top: 10px; min-height: 18px; }
  .foot { color: var(--muted); font-size: 12px; font-weight: 600; margin-top: 18px; text-align: center; }
  @media (max-width: 980px) { .kpis { grid-template-columns: repeat(3, 1fr); } .grid, .grid3 { grid-template-columns: 1fr; } }
  @media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, 1fr); } .kpi b { font-size: 26px; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const HELPER = "https://movio-helper.g41us-jarvis.workers.dev";
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const PF = { tv: ["📺", "Android TV"], phone: ["🤖", "Android phone"], ios: ["📱", "iPhone"], web: ["🌐", "Web"] };
const pf = (k) => PF[k] || ["•", k || "Unknown"];
const flag = (c) => c && c.length === 2 ? String.fromCodePoint(...[...c.toUpperCase()].map((x) => 0x1f1a5 + x.charCodeAt(0))) : "🌍";
const country = (c) => { try { return new Intl.DisplayNames(["en"], { type: "region" }).of(c); } catch { return c || "Unknown"; } };
const ago = (t, now) => { const m = Math.round((now - t) / 60e3); return m < 1 ? "just now" : `${m} min ago`; };
let pass = sessionStorage.getItem("adm") || "", timer;

function login(err = "") {
  app.innerHTML = `<div class="login"><img src="icons/icon-192.png" alt=""><h1>Movio admin</h1><p>Enter the admin password.</p>
    <form id="f"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus><button>Open dashboard</button></form><div class="err">${esc(err)}</div></div>`;
  document.getElementById("f").onsubmit = (e) => { e.preventDefault(); pass = document.getElementById("pw").value; load(); };
}

async function load() {
  const r = await fetch(`${HELPER}/admin/data`, { headers: { Authorization: "Bearer " + pass } }).catch(() => null);
  if (!r || r.status === 401) { sessionStorage.removeItem("adm"); return login(r ? "That password isn't right." : "Couldn't reach Movio's server. Try again."); }
  sessionStorage.setItem("adm", pass);
  render(await r.json());
  clearTimeout(timer); timer = setTimeout(load, 30e3);
}

function list(items, max, fn, none) {
  if (!items.length) return `<div class="empty">${none}</div>`;
  const top = Math.max(...items.map((x) => x.n), 1);
  return items.slice(0, max).map((x) => fn(x, (x.n / top) * 100)).join("");
}

function render(d) {
  const days = [];
  for (let i = 29; i >= 0; i--) { const k = new Date(d.now + 3600e3 - i * 86400e3).toISOString().slice(0, 10); days.push({ k, n: d.daily.find((x) => x.day === k)?.n || 0 }); }
  const peak = Math.max(...days.map((x) => x.n), 1);
  const titles = Object.entries(d.stats.titles || {}).map(([k, v]) => ({ k, ...v }));
  const played = titles.filter((x) => x.plays > 0).sort((a, b) => b.plays - a.plays).map((x) => ({ ...x, n: x.plays }));
  const liked = titles.filter((x) => x.likes > 0).sort((a, b) => b.likes - a.likes).map((x) => ({ ...x, n: x.likes }));
  const genres = Object.entries(d.stats.genres || {}).map(([k, v]) => ({ k, n: (v.plays || 0) + (v.likes || 0) })).filter((x) => x.n > 0).sort((a, b) => b.n - a.n);
  const latest = {};
  for (const v of d.versions) { const [p, ver] = v.k.split(" "); if (!latest[p] || ver.localeCompare(latest[p], undefined, { numeric: true }) > 0) latest[p] = ver; }
  const poster = (x) => x.poster ? `<img class="poster" src="https://image.tmdb.org/t/p/w92${esc(x.poster)}" alt="">` : `<div class="poster"></div>`;
  app.innerHTML = `
  <header><img src="icons/icon-192.png" alt=""><div><h1>Movio admin</h1><small>Updated ${new Date(d.now).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })} · refreshes every 30 s</small></div>
    <div class="sp"></div><span class="live"><i></i>${d.watching.length} watching now</span></header>
  <div class="kpis">
    <div class="kpi hot"><b>${d.watching.length}</b><span>Watching now</span></div>
    <div class="kpi"><b>${d.today}</b><span>Used Movio today</span></div>
    <div class="kpi"><b>${d.week}</b><span>This week</span></div>
    <div class="kpi"><b>${d.month}</b><span>This month</span></div>
    <div class="kpi"><b>${d.total}</b><span>All devices ever</span></div>
    <div class="kpi"><b>${d.newToday}</b><span>New today</span></div>
  </div>
  <div class="grid">
    <div class="card"><h2>People each day · last 30 days</h2><div class="chart">${days.map((x, i) => `<div class="c"><div class="bar" data-n="${x.n}" style="height:${(x.n / peak) * 100}%${x.n ? "" : ";background:rgba(255,255,255,.08)"}"></div>${i % 5 === 4 || i === 29 ? `<span class="d">${new Date(x.k).toLocaleDateString([], { day: "numeric", month: "short" })}</span>` : `<span class="d">&nbsp;</span>`}</div>`).join("")}</div></div>
    <div class="card"><h2>Watching now</h2>${d.watching.length ? d.watching.map((w) => `<div class="row"><div class="ic">${pf(w.platform)[0]}</div><div class="t"><b>${esc(w.title)}</b><small>${w.kind === "live" ? "Live TV" : w.kind === "tv" ? "Series" : "Film"} · ${pf(w.platform)[1]} · ${ago(w.at, d.now)}</small></div></div>`).join("") : `<div class="empty">Nobody is watching right now.</div>`}</div>
  </div>
  <div class="grid3">
    <div class="card"><h2>Devices · last 30 days</h2>${list(d.platforms, 6, (x, w) => `<div class="row"><div class="ic">${pf(x.k)[0]}</div><div class="t"><b>${pf(x.k)[1]}</b><div class="meter"><i style="width:${w}%"></i></div></div><div class="n">${x.n}</div></div>`, "No devices yet.")}</div>
    <div class="card"><h2>App versions</h2>${list(d.versions, 8, (x, w) => { const [p, v] = x.k.split(" "); const old = latest[p] && v !== latest[p]; return `<div class="row"><div class="ic">${pf(p)[0]}</div><div class="t"><b>${pf(p)[1]} ${esc(v)}</b><small>${old ? "Older version" : "Newest"}</small></div><div class="n">${x.n}</div></div>`; }, "No versions yet.")}</div>
    <div class="card"><h2>Countries</h2>${list(d.countries, 8, (x, w) => `<div class="row"><div class="ic">${flag(x.k)}</div><div class="t"><b>${esc(country(x.k))}</b><div class="meter"><i style="width:${w}%"></i></div></div><div class="n">${x.n}</div></div>`, "No countries yet.")}</div>
  </div>
  <div class="grid3">
    <div class="card"><h2>Most played</h2>${list(played, 8, (x) => `<div class="row">${poster(x)}<div class="t"><b>${esc(x.name)}</b><small>${x.kind === "tv" ? "Series" : "Film"}</small></div><div class="n">${x.n}</div></div>`, "Nothing played yet.")}</div>
    <div class="card"><h2>Most liked</h2>${list(liked, 8, (x) => `<div class="row">${poster(x)}<div class="t"><b>${esc(x.name)}</b><small>${x.kind === "tv" ? "Series" : "Film"}</small></div><div class="n">♥ ${x.n}</div></div>`, "Nothing liked yet.")}</div>
    <div class="card"><h2>Favourite genres</h2>${list(genres, 8, (x, w) => `<div class="row"><div class="t"><b>${esc(x.k)}</b><div class="meter"><i style="width:${w}%"></i></div></div><div class="n">${x.n}</div></div>`, "No genres yet.")}</div>
  </div>
  <div class="foot">Counts devices, not people: one person on a phone and a TV shows as two. No names or emails are collected.</div>`;
}

pass ? load() : login();
</script>
</body>
</html>
