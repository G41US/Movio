name: Web

on:
  push:
    branches: [main]
    paths: ["web/**", "worker/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Helper server (Cloudflare)
        id: helper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          WYZIE_API_KEY: ${{ secrets.WYZIE_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to set up the helper."
            echo "url=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cd worker
          npx --yes wrangler@3 deploy 2>&1 | tee out.txt
          printf '%s' "$TMDB_API_KEY" | npx --yes wrangler@3 secret put TMDB_KEY
          printf '%s' "$WYZIE_API_KEY" | npx --yes wrangler@3 secret put WYZIE_KEY
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' out.txt | head -1)
          echo "Helper: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: App config
        env:
          HELPER_URL: ${{ steps.helper.outputs.url }}
        run: |
          printf 'window.MOVIO = { helper: "%s" };\n' "$HELPER_URL" > web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
