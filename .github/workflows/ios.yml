name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Keys
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          WYZIE_API_KEY: ${{ secrets.WYZIE_API_KEY }}
        run: |
          printf 'enum Keys {\n    static let tmdb = "%s"\n    static let wyzie = "%s"\n}\n' "$TMDB_API_KEY" "$WYZIE_API_KEY" > ios/Movio/Keys.swift
      - name: Build
        run: |
          VER=$(cat ios/VERSION)
          cd ios && xcodegen generate
          xcodebuild -project Movio.xcodeproj -scheme Movio -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=$VER CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | xcbeautify --renderer github-actions
      - name: Package
        run: |
          mkdir -p Payload && cp -R ios/build/Build/Products/Release-iphoneos/Movio.app Payload/
          zip -qry Movio.ipa Payload
          ls -la Movio.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Movio-ipa
          path: Movio.ipa
      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(cat ios/VERSION)
          TAG="ios-v$VER"
          cp Movio.ipa "Movio-$VER.ipa"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Movio-$VER.ipa" Movio.ipa --clobber
          else
            gh release create "$TAG" "Movio-$VER.ipa" Movio.ipa --title "Movio for iPhone $VER" --notes "" --latest=false
          fi
      - name: AltStore source
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # AltStore / SideStore read this file and offer each new version as an update.
          VER=$(cat ios/VERSION)
          SIZE=$(stat -f%z Movio.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          URL="https://github.com/${{ github.repository }}/releases/download/ios-v$VER/Movio-$VER.ipa"
          ICON="https://raw.githubusercontent.com/${{ github.repository }}/main/ios/Movio/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          cat > altstore.json <<JSON
          {
            "name": "Movio",
            "identifier": "com.g41us.movio.source",
            "iconURL": "$ICON",
            "tintColor": "#9B6DFF",
            "apps": [{
              "name": "Movio",
              "bundleIdentifier": "com.g41us.movio",
              "developerName": "G41US",
              "subtitle": "Movies and shows",
              "localizedDescription": "Movies and TV shows, with My List, Continue watching, downloads and subtitles.",
              "iconURL": "$ICON",
              "tintColor": "#9B6DFF",
              "version": "$VER",
              "versionDate": "$DATE",
              "downloadURL": "$URL",
              "size": $SIZE,
              "versions": [{ "version": "$VER", "date": "$DATE", "downloadURL": "$URL", "size": $SIZE, "minOSVersion": "16.0" }],
              "appPermissions": { "entitlements": [], "privacy": {} }
            }],
            "news": []
          }
          JSON
          python3 -m json.tool altstore.json > /dev/null
          gh release view ios-source >/dev/null 2>&1 || gh release create ios-source --title "Movio for iPhone · AltStore source" --notes "" --latest=false
          gh release upload ios-source altstore.json --clobber
