name: Release

# Bump versionName/versionCode in version.properties and push to main.
# This builds a signed APK and publishes it as the latest GitHub Release,
# which the in-app updater checks.
on:
  push:
    branches: [main]
    paths: [version.properties]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(grep '^versionName=' version.properties | cut -d= -f2)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if gh release view "v$name" >/dev/null 2>&1; then
            echo "Release v$name already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore signing key
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MOVIO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the MOVIO_KEYSTORE_BASE64, MOVIO_KEYSTORE_PASSWORD, MOVIO_KEY_ALIAS and MOVIO_KEY_PASSWORD repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/movio-release.jks"

      - uses: actions/setup-java@v5
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.skip != 'true'
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - if: steps.version.outputs.skip != 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip != 'true'
        with:
          gradle-version: "8.13"

      - name: Build release APK
        if: steps.version.outputs.skip != 'true'
        env:
          MOVIO_KEYSTORE_PATH: ${{ runner.temp }}/movio-release.jks
          MOVIO_KEYSTORE_PASSWORD: ${{ secrets.MOVIO_KEYSTORE_PASSWORD }}
          MOVIO_KEY_ALIAS: ${{ secrets.MOVIO_KEY_ALIAS }}
          MOVIO_KEY_PASSWORD: ${{ secrets.MOVIO_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify signature
        if: steps.version.outputs.skip != 'true'
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          cp "$apk" "Movio-${{ steps.version.outputs.name }}.apk"

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.name }}" "Movio-${{ steps.version.outputs.name }}.apk" \
            --target "$GITHUB_SHA" \
            --title "Movio ${{ steps.version.outputs.name }}" \
            --notes "" \
            --latest
