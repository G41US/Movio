name: Release

# Push a tag like v0.2.0 to build a signed APK and publish it as the latest
# GitHub Release, which the in-app updater checks.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MOVIO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the MOVIO_KEYSTORE_BASE64, MOVIO_KEYSTORE_PASSWORD, MOVIO_KEY_ALIAS and MOVIO_KEY_PASSWORD repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/movio-release.jks"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        env:
          MOVIO_KEYSTORE_PATH: ${{ runner.temp }}/movio-release.jks
          MOVIO_KEYSTORE_PASSWORD: ${{ secrets.MOVIO_KEYSTORE_PASSWORD }}
          MOVIO_KEY_ALIAS: ${{ secrets.MOVIO_KEY_ALIAS }}
          MOVIO_KEY_PASSWORD: ${{ secrets.MOVIO_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease \
            -PmovioVersionName=${{ steps.version.outputs.name }} \
            -PmovioVersionCode=${{ steps.version.outputs.code }}

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          cp "$apk" "Movio-${{ steps.version.outputs.name }}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Movio-${{ steps.version.outputs.name }}.apk" \
            --title "Movio ${{ steps.version.outputs.name }}" \
            --notes "" \
            --latest
