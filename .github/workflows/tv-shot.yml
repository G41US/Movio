name: TV screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: gradle --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p shots
            adb shell am start -n com.g41us.movio/.MainActivity
            sleep 12
            adb exec-out screencap -p > shots/0a_setup.png
            adb shell input text Marvelous
            adb shell input keyevent KEYCODE_ENTER
            sleep 3
            adb exec-out screencap -p > shots/0b_setup_lang.png
            adb shell input keyevent KEYCODE_DPAD_DOWN
            adb shell input keyevent KEYCODE_DPAD_DOWN
            adb shell input keyevent KEYCODE_DPAD_DOWN
            adb shell input keyevent KEYCODE_DPAD_DOWN
            sleep 2
            adb exec-out screencap -p > shots/0c_setup_lang_down.png
            adb shell am force-stop com.g41us.movio
            adb shell run-as com.g41us.movio mkdir -p shared_prefs
            adb shell "run-as com.g41us.movio sh -c 'echo \"<?xml version=\\\"1.0\\\" encoding=\\\"utf-8\\\" standalone=\\\"yes\\\" ?><map><boolean name=\\\"setup_done\\\" value=\\\"true\\\" /><string name=\\\"lang\\\">en</string><string name=\\\"sub_lang\\\">en</string><string name=\\\"name\\\">Marvelous</string></map>\" > shared_prefs/movio_profile.xml'"
            adb shell am start -n com.g41us.movio/.MainActivity
            sleep 25
            mkdir -p shots
            adb exec-out screencap -p > shots/1_home.png
            adb shell input keyevent KEYCODE_DPAD_LEFT
            sleep 3
            adb exec-out screencap -p > shots/2_menu.png
            adb shell input keyevent KEYCODE_DPAD_DOWN
            sleep 2
            adb exec-out screencap -p > shots/3_menu_down.png
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 2
            adb shell input keyevent KEYCODE_DPAD_DOWN
            sleep 3
            adb exec-out screencap -p > shots/4_rows.png
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            sleep 3
            adb exec-out screencap -p > shots/5_rows_side.png
            adb shell input keyevent KEYCODE_DPAD_DOWN
            adb shell input keyevent KEYCODE_DPAD_DOWN
            sleep 3
            adb exec-out screencap -p > shots/6_lower.png
            adb shell input keyevent KEYCODE_DPAD_LEFT
            sleep 1
            for i in 1 2 3 4 5 6; do adb shell input keyevent KEYCODE_DPAD_DOWN; done
            adb shell input keyevent KEYCODE_DPAD_CENTER
            sleep 4
            adb exec-out screencap -p > shots/7_settings.png
            adb shell input keyevent KEYCODE_DPAD_RIGHT
            for i in 1 2 3 4 5 6 7; do adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 0.3; done
            sleep 2
            adb exec-out screencap -p > shots/8_settings_link.png
      - uses: actions/upload-artifact@v4
        with:
          name: tv-shots
          path: shots
